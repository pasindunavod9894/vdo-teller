# Local database for VDO Teller: Postgres only. The app itself runs on your machine with `pnpm dev`.
#   docker compose up -d        start the database (port 5434)
#   docker compose down         stop it (the data stays in the volume)
# DATABASE_URL in .env must match: postgres://vdo:<POSTGRES_PASSWORD>@127.0.0.1:5434/vdo_teller
services:
  postgres:
    image: postgres:17-alpine
    container_name: vdo-teller-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vdo
      POSTGRES_DB: vdo_teller
      # set in .env (the same password as in DATABASE_URL); it is only used the first time the volume is created
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (the password from DATABASE_URL)}
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vdo -d vdo_teller']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    # the volume that already holds this project's data (made before this file existed); do not rename it
    name: vdo-teller-pgdata
    external: true
